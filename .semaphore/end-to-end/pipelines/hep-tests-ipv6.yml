version: v1.0

name: IPTables

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

execution_time_limit:
  hours: 12

global_job_config:
  prologue:
    commands_file: ../scripts/global_prologue.sh
  epilogue:
    always:
      commands:
        - ~/calico/.semaphore/end-to-end/scripts/global_epilogue.sh
  secrets:
    - name: marvin-github-ssh-private-key
    - name: banzai-secrets
  env_vars:
    # This should match the default flags with the additional skip of the "Proxy version v1". There is a problem with the server pod failing to bind to the port for listening.
    - name: K8S_E2E_FLAGS
      value: --ginkgo.focus=should.correctly.implement.Host.Endpoint.NetworkPolicy --ginkgo.skip=(\[Slow\]|\[Disruptive\]|\[DataPath\]|Proxy.version.v1.should.proxy.through.a.service.and.a.pod|WireGuard)
    - name: DATAPLANE
      value: "CalicoIptables"
    - name: IPV4_POD_CIDR
      value: "192.168.0.0/16"
    - name: FUNCTIONAL_AREA
      value: "iptables.yml"
    - name: USE_PRIVATE_REGISTRY
      value: "true"
    - name: PRIVATE_REGISTRY
      value: "quay.io/"
    - name: K8S_E2E_IMAGE
      value: "gcr.io/tigera-dev/k8s-e2e@sha256:816f993c59a11b91f3c8acf48cd5b30aa4cf8d4f47c1295331977f8b253a482b"

blocks:
  - name: dual-stack k8s-e2e
    dependencies: []
    task:
      agent:
        machine:
          type: f1-standard-2
          os_image: ubuntu2204
      jobs:
        - name: kdd
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: MANIFEST_FILE
              values: ["calico.yaml", "calico-typha.yaml"]
        - name: etcd
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: INSTALL_ETCD_POD
              value: "true"
            - name: MANIFEST_FILE
              value: calico-etcd.yaml
            - name: K8S_E2E_FLAGS
              value: --ginkgo.focus=should.correctly.implement.Host.Endpoint.NetworkPolicy --ginkgo.skip=(\[Slow\]|\[Disruptive\]|\[DataPath\]|WireGuard|EndpointSlice)
      env_vars:
        - name: K8S_VERSION
          value: "stable-1" # Normally this would be stable, but kind doesn't always support stable immediately
        - name: K8S_E2E_FLAGS
          value: --ginkgo.focus=should.correctly.implement.Host.Endpoint.NetworkPolicy --ginkgo.skip=(\[Slow\]|\[Disruptive\]|\[DataPath\]|WireGuard)
        - name: PROVISIONER
          value: local-kind
        - name: ENABLE_DUAL_STACK
          value: "true"
        - name: K8S_E2E_EXTRA_FLAGS
          value: --feature-gates=dualstack=true
        - name: KIND_CONFIG
          value: |
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            networking:
              disableDefaultCNI: true
              ipFamily: dual
              podSubnet: "192.168.0.0/16,fd00:10:244::/64"
            nodes:
            # the control plane node
            - role: control-plane
            - role: worker
            - role: worker
            - role: worker

  - name: AutoHEP test
    dependencies: []
    task:
      agent:
        machine:
          type: f1-standard-2
          os_image: ubuntu2204
      jobs:
        - name: Test with AutoHEP enabled
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
      env_vars:
        - name: ENABLE_AUTOHEP
          value: "true"
        - name: PROVISIONER
          value: "local-kind"

  - name: IPVS
    dependencies: []
    task:
      jobs:
        - name: ipvs
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: K8S_VERSION
              values: ["stable"]
          env_vars:
            - name: PROVISIONER
              value: gcp-kubeadm
            - name: KUBE_PROXY_MODE
              value: ipvs

  - name: usage reporting
    dependencies: []
    task:
      agent:
        machine:
          type: f1-standard-2
          os_image: ubuntu2204
      jobs:
        - name: mainline
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: K8S_VERSION
              values: ["stable"]
      env_vars:
        - name: PROVISIONER
          value: local-kind
        - name: MANIFEST_FILE
          value: calico.yaml
        - name: ENABLE_USAGE
          value: "true"
        - name: TEST_TYPE
          value: usage-reporting
      secrets:
        - name: dynamo-read-creds

  # This is the old staging runs
  - name: k8s beta runs
    dependencies: []
    task:
      jobs:
        - name: k8s beta
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: K8S_VERSION
              values: ["beta"]
            - env_var: MANIFEST_FILE
              values: ["calico.yaml"]
            - env_var: KUBE_PROXY_MODE
              values: ["iptables"]
          env_vars:
            - name: USE_HASH_RELEASE
              value: "true"
            - name: PROVISIONER
              value: "gcp-kubeadm"

  - name: k8s distros
    dependencies: []
    task:
      jobs:
        - name: install required
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: PROVISIONER
              values: ["gcp-rancher"]
          env_vars:
            - name: RKE_VERSION
              value: "v1.7.1" # https://github.com/rancher/rke/releases/tag/v1.7.1
            - name: K8S_VERSION
              value: "v1.31.3" # RKE 1.7.1. supports: v1.31.3, v1.30.7, v1.29.11, v1.28.15

  - name: WireGuard VXLAN k8s-e2e
    dependencies: []
    task:
      jobs:
        - name: wireguard-vxlan-aws-kubeadm
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: K8S_VERSION
              values: ["stable"]
      env_vars:
        - name: ENABLE_EXTERNAL_NODE
          value: "true"
        - name: USE_HASH_RELEASE
          value: "true"
        - name: ENABLE_WIREGUARD
          value: "true"
        - name: USE_VXLAN
          value: "true"
        - name: PROVISIONER
          value: "aws-kubeadm"
        - name: K8S_E2E_FLAGS
          value: --ginkgo.focus=should.correctly.implement.Host.Endpoint.NetworkPolicy
          # Single VPC only
        - name: VPC_SUBNETS
          value: '["172.16.101.0/24"]'
        - name: IPAM_TEST_POOL_SUBNET
          value: "10.0.0.0/29"

  - name: WireGuard k8s-e2e
    dependencies: []
    task:
      jobs:
        - name: aws-kubeadm-calico-cni with/without IP-in-IP
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: K8S_VERSION
              values: ["stable"]
            - env_var: DISABLE_IPIP
              values: ["true", "false"]
      env_vars:
        - name: ENABLE_EXTERNAL_NODE
          value: "true"
        - name: USE_HASH_RELEASE
          value: "true"
        - name: ENABLE_WIREGUARD
          value: "true"
        - name: PROVISIONER
          value: "aws-kubeadm"
        - name: K8S_E2E_FLAGS
          value: --ginkgo.focus=should.correctly.implement.Host.Endpoint.NetworkPolicy
          # Single VPC only
        - name: VPC_SUBNETS
          value: '["172.16.101.0/24"]'
        - name: IPAM_TEST_POOL_SUBNET
          value: "10.0.0.0/29"

  - name: Operator Migration
    dependencies: []
    task:
      agent:
        machine:
          type: f1-standard-2
          os_image: ubuntu2204
      jobs:
        - name: kind dual-stack
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: PROVISIONER
              value: local-kind
            - name: PRODUCT
              value: calico
            - name: INSTALLER
              value: "manual"
            - name: USE_HASH_RELEASE
              value: "true"
            - name: OPERATOR_MIGRATE
              value: "true"
            - name: IP_FAMILY
              value: dual
            - name: IPV6_POD_CIDR
              value: "fd00:10:244::/64"
          matrix:
            - env_var: K8S_VERSION
              values: ["stable-1"]

        - name: kind IPv6
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          env_vars:
            - name: PROVISIONER
              value: local-kind
            - name: PRODUCT
              value: calico
            - name: INSTALLER
              value: "manual"
            - name: USE_HASH_RELEASE
              value: "true"
            - name: OPERATOR_MIGRATE
              value: "true"
            - name: IP_FAMILY
              value: ipv6
            - name: IPV4_POD_CIDR
              value: ""
            - name: IPV6_POD_CIDR
              value: "fd00:10:244::/64"
          matrix:
            - env_var: K8S_VERSION
              values: ["stable-1"]

  # This is the old wireguard tests
  - name: WireGuard regression k8s-e2e
    dependencies: []
    task:
      jobs:
        - name: kdd - new
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: K8S_VERSION
              values: ["stable"]
          env_vars:
            - name: K8S_E2E_FLAGS
              value: --ginkgo.focus=should.correctly.implement.Host.Endpoint.NetworkPolicy --ginkgo.skip=(\[Slow\]|\[Disruptive\]|\[DataPath\])
            - name: DISABLE_IPIP
              value: "true"
              # Single VPC only
            - name: VPC_SUBNETS
              value: '["172.16.101.0/24"]'
            - name: IPAM_TEST_POOL_SUBNET
              value: "10.0.0.0/29"
            - name: PROVISIONER
              value: "aws-kubeadm"

        - name: kdd - old
          execution_time_limit:
            hours: 7
          commands:
            - ~/calico/.semaphore/end-to-end/scripts/body_standard.sh
          matrix:
            - env_var: K8S_VERSION
              values: ["stable-3"]
          env_vars:
            # The skip "EndpointSlice\|Services\sshould" is needed to skip Endpoint slice tests which are only possible in k8s 1.21+
            # The skip "Ingress.API|IngressClass.API" is needed to skip Ingress tests which are only possible in k8s 1.21+
            # The skip "Proxy.version.v1.*pod.and.service.Proxy.\[" is needed to skip an upstream test that only works on k8s 1.24+
            - name: K8S_E2E_FLAGS
              value: --ginkgo.focus=should.correctly.implement.Host.Endpoint.NetworkPolicy --ginkgo.skip=(\[Slow\]|\[Disruptive\]|\[DataPath\]|EndpointSlice|Services\sshould|Ingress.API|IngressClass.API|Proxy.version.v1.*pod.and.service.Proxy.\[)
            - name: DISABLE_IPIP
              value: "true"
              # Single VPC only
            - name: VPC_SUBNETS
              value: '["172.16.101.0/24"]'
            - name: IPAM_TEST_POOL_SUBNET
              value: "10.0.0.0/29"
            - name: PROVISIONER
              value: "aws-kubeadm"

      env_vars:
        - name: USE_HASH_RELEASE
          value: "true"
        - name: ENABLE_WIREGUARD
          value: "true"

promotions:
  - name: Cleanup jobs
    pipeline_file: cleanup.yml
    auto_promote:
      when: "result = 'stopped'"

after_pipeline:
  task:
    jobs:
      - name: Reports
        commands:
          - test-results gen-pipeline-report --force
