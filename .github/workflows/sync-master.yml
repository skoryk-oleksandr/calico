name: Sync master from upstream

on:
  schedule:
    - cron: '0 * * * *'   # hourly
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/projectcalico/calico.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Merge upstream/master
        run: |
          git checkout master
          git merge upstream/master

      - name: Push
        run: |
          git push origin master
