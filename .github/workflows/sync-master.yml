name: Sync master from upstream

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/projectcalico/calico.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Merge upstream (exclude workflows)
        run: |
          git checkout master

          git config user.name  "Calico Sync Bot"
          git config user.email "calico-sync-bot@users.noreply.github.com"

          # Merge but stop before commit
          git merge upstream/master --no-commit

          # Drop upstream workflow changes
          git restore --staged .github/workflows
          git restore .github/workflows

          # Commit only non-workflow changes
          if git diff --cached --quiet; then
            echo "No non-workflow changes to commit"
          else
            git commit -m "Sync upstream (excluding workflows)"
          fi

      - name: Push
        run: |
          git push origin master
