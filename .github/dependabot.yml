version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "golang.org/x/*"
    labels:
      - "dependencies"
      - "release-note-not-required"
      - "docs-not-required"
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
